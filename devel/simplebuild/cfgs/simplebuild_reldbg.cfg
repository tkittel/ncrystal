[bundle]
  pkg_root = './dummy' # Until https://github.com/mctools/simplebuild/issues/21
[depend]
  bundles= [ 'ncrystaldynamic', 'ncrystalstatic' ]
  search_path = [ "../", "../static" ]
[build]
  cachedir = '../simplebuild_cache/cache_cfg_reldbg'
  mode = 'reldbg'
[build.flagsets]
  #Extra flags for checking FMA and contraction effects, selected with -X
  #(e.g. "ncdevtool sb -X fma -t"), each with its own build directory. The
  #first three need x86, and app_fmadispatch fails with them by design (it
  #expects a build without FMA). Keep in sync with the other cfgs here.
  fma        = { extra_cflags = [ '-mfma' ] }
  fmafast    = { extra_cflags = [ '-mfma', '-ffp-contract=fast' ] }
  v3         = { extra_cflags = [ '-march=x86-64-v3' ] }
  nocontract = { extra_cflags = [ '-ffp-contract=off' ] }
