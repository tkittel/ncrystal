[bundle]
  pkg_root = './dummy' # Until https://github.com/mctools/simplebuild/issues/21
[depend]
  bundles= [ 'ncrystaldynamic', 'ncrystalstatic' ]
  search_path = [ "../", "../static" ]
[build]
  cachedir = '../simplebuild_cache/cache_cfg_debug'
  mode = 'debug'
[build.flagsets]
  #See simplebuild_reldbg.cfg:
  fma        = { extra_cflags = [ '-mfma' ] }
  fmafast    = { extra_cflags = [ '-mfma', '-ffp-contract=fast' ] }
  v3         = { extra_cflags = [ '-march=x86-64-v3' ] }
  nocontract = { extra_cflags = [ '-ffp-contract=off' ] }
