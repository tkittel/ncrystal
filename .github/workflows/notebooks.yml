name: notebooks

# Test the notebooks of the ncrystal-notebooks repository with the NCrystal
# code of this repository, using the ncnotebookdevtool of that repository (which
# builds NCrystal from this checkout, installs it in environments providing the
# requirements of each notebook, and verifies that it is the one used).

on:
  push:
  pull_request:
  schedule:
    - cron: '30 21 * * 0'  # 21:30 every Sunday

jobs:
  ncdevtool_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: src
      - name: Pip install packages for ncdevtool
        run: pip install -r ./src/devel/reqs/requirements_devel.txt
      - name: ncdevtool checks
        run: ./src/devel/bin/ncdevtool check -n "fix""me"

  pip:
    needs: [ ncdevtool_check ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.10' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.14' }
          - { os: macos-latest,  CC: clang,    CXX: clang++,    python: '3.13' }
    name: pip.${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src_ncrystal

      #TEMPORARY: the notebook tool is not yet in mctools/ncrystal-notebooks.
    - name: Checkout ncrystal-notebooks
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: tkittel/ncrystal-notebooks
        ref: main
        path: src_notebooks

    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}

    - name: Enable parallel cmake
      run: python ./src_ncrystal/devel/bin/ncdevtool nprocs --enable-github-parallel

    - name: Pip install tomli (for the notebook tool with Python 3.10)
      if: matrix.python == '3.10'
      run: python -m pip install tomli

      #Notebooks marked as slow are always skipped here (to keep this CI fast).
    - name: Test notebooks installable with pip
      run: >-
        python ./src_notebooks/devel/bin/ncnotebookdevtool test
        --select pip --env venv --skip-slow -j 3
        --ncrystal-src ./src_ncrystal
        --workdir "${{ runner.temp }}/work"

    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: failed-notebooks-pip-${{ matrix.os }}-${{ matrix.python }}
        path: |
          ${{ runner.temp }}/work/*.log
          ${{ runner.temp }}/work/*/*.executed.ipynb

  conda:
    needs: [ ncdevtool_check ]
    name: conda.ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src_ncrystal

      #TEMPORARY: the notebook tool is not yet in mctools/ncrystal-notebooks.
    - name: Checkout ncrystal-notebooks
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: tkittel/ncrystal-notebooks
        ref: main
        path: src_notebooks

    - uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"

    - name: Enable parallel cmake
      run: python ./src_ncrystal/devel/bin/ncdevtool nprocs --enable-github-parallel

      #Notebooks marked as slow are always skipped here (to keep this CI fast).
    - name: Test notebooks needing conda
      run: >-
        python ./src_notebooks/devel/bin/ncnotebookdevtool test
        --select conda --env conda --skip-slow -j 2
        --ncrystal-src ./src_ncrystal
        --workdir "${{ runner.temp }}/work"

    - name: Upload logs of failed notebooks
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: failed-notebooks-conda
        path: |
          ${{ runner.temp }}/work/*.log
          ${{ runner.temp }}/work/*/*.executed.ipynb
