name: systemwideinstall

#Test which does not use CMAKE_INSTALL_PREFIX

on:
  push:
  pull_request:
  schedule:
    - cron: '14 15 * * 0'  # 14:15 every Sunday

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    #Temporary workaround (expires 2027-02-01, then remove these two steps): the
    #default macOS python3 is 3.15, for which gemmi (in ncrystal_verify[all])
    #has no wheels, and building it from source fails with nanobind 3:
    - name: Check if macOS python workaround is active
      id: pyworkaround
      run: |
        if [ "$(date -u +%Y%m%d)" -lt 20270201 ]; then
          echo "active=1" >> $GITHUB_OUTPUT
        else
          echo "::warning::macOS python3.14 workaround in systemwideinstall.yml expired, please remove it"
        fi

    - name: Setup python 3.14 (macOS workaround)
      if: runner.os == 'macOS' && steps.pyworkaround.outputs.active == '1'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.14'

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    - name: Configure
      run: cmake -S ./src/ncrystal_core -B ./build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ./build

    - name: Install
      run: sudo cmake --install ./build

    - name: which ncrystal-config
      run: which ncrystal-config

    - name: ncrystal-config summary
      run: ncrystal-config -s

    - name: Pip install ncrystal_python (Linux)
      if: runner.os == 'Linux'
      run: python3 -mpip install ./src/ncrystal_python

    - name: Pip install ncrystal_python (macOS)
      if: runner.os == 'macOS'
      run: sudo "$(which python3)" -mpip install --break-system-packages ./src/ncrystal_python

    - name: Python test
      run: python3 -mNCrystal nctool --test

    - name: Downstream CMake
      run: |
        set -eu
        mkdir bld_ds inst_ds
        cmake -S ./src/examples/downstream_cmake -B ./bld_ds -DCMAKE_INSTALL_PREFIX=./inst_ds -DCMAKE_BUILD_TYPE=Debug
        cmake --build ./bld_ds
        cmake --install ./bld_ds
        export LD_LIBRARY_PATH="$(ncrystal-config --show libdir):${LD_LIBRARY_PATH:-}"
        export DYLD_LIBRARY_PATH="$(ncrystal-config --show libdir):${DYLD_LIBRARY_PATH:-}"
        ./inst_ds/bin/testapp

    - name: Pip install ncrystal_verify (Linux)
      if: runner.os == 'Linux'
      run: python3 -mpip install "./src/ncrystal_verify[all]"

    - name: Pip install ncrystal_verify (macOS)
      if: runner.os == 'macOS'
      run: sudo "$(which python3)" -mpip install --break-system-packages "./src/ncrystal_verify[all]"

    - name: Launch ncrystal-verify
      run: ncrystal-verify
