name: windll

# Exercises all branches of how the ncrystal-core Python module locates
# NCrystal.dll on Windows (RECORD lookup, directory heuristic, sysconfig scheme
# search), for venv, user and --target installations, pip build isolation, and
# the error case. See devel/ci/windll_lookup.py.

on:
  push:
  pull_request:

jobs:
  windll:
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.9', '3.14' ]
    name: windll.py${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    - name: Build ncrystal-core wheel
      run: python -m pip wheel --no-deps --wheel-dir ./wheels ./src/ncrystal_core

    - name: Test NCrystal.dll lookup scenarios
      run: python ./src/devel/ci/windll_lookup.py ./wheels ./src

  collect_logs:
    #Single job (run even if others fail) downloading the complete logs of
    #all other jobs of this run via the GitHub API and bundling them into one
    #tarball artifact, so everything can be grabbed with a single download:
    name: Collect all CI logs
    needs: [ windll ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download the logs of all jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all-ci-logs
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --jq '.jobs[] | select(.name != "Collect all CI logs") | "\(.id)\t\(.conclusion)\t\(.name)"' > jobs.txt
          cp jobs.txt all-ci-logs/jobs.txt
          while IFS=$'\t' read -r id concl name; do
            fn=$(printf '%s' "${concl}__${name}" | tr -c 'A-Za-z0-9._=-' '_')
            gh api "repos/${{ github.repository }}/actions/jobs/${id}/logs" > "all-ci-logs/${fn}.log" \
              || echo "Could not get log of job ${id} (${name})"
          done < jobs.txt
          tar -czf all-ci-logs-${{ github.sha }}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: all-ci-logs-${{ github.sha }}
          path: all-ci-logs-${{ github.sha }}.tar.gz
          if-no-files-found: warn
