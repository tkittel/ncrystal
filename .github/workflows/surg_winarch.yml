name: surg_winarch
on:
  push:
#Surgical (throwaway): MSVC library-only builds for x64 and cross ARM64.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, ARM64 ]
    name: ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src
    - name: configure + build library only
      shell: bash
      run: |
        cmake -S src/ncrystal_core -B build -A ${{ matrix.arch }} -DNCRYSTAL_ENABLE_EXAMPLES=OFF -DNCRYSTAL_BUILD_STRICT=ON > cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
        grep -rl "NCRYSTAL_DISPATCH_TO_WIN_FMA" build/*.vcxproj > /dev/null && echo "WIN_FMA dispatch: ENABLED" || echo "WIN_FMA dispatch: disabled"
        cmake --build build --config Release --parallel 4 -- -v:m 2>&1 | grep -E "error|warning C|NCrystal.dll" | head -40
        test -f build/Release/NCrystal.dll && echo "built OK"
